name: Winter tire watch
on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours (UTC)
  workflow_dispatch: {}      # lets you run it manually from the Actions tab
permissions:
  contents: write
concurrency: tire-watch
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Search Craigslist and notify
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          SMS_TO: ${{ secrets.SMS_TO }}
        run: python tire_watch.py
      - name: Save seen listings
        if: always()
        run: |
          git config user.name "tire-watch"; git config user.email "tire-watch@users.noreply.github.com"
          git add seen.json && (git diff --cached --quiet || git commit -m "Update seen listings" && git push) || true
